[pytest]
# Each exercise lives next to its test. These folders go on the import path so a test
# can simply write: from fizzbuzz import fizzbuzz
pythonpath =
    python/exercises/week0_data_types
    python/exercises/week1_basics
    python/exercises/week2_collections
    python/exercises/week3_stacks_and_search
    python/exercises/week4_linked_lists_and_trees
    theory/exercises
    sql
testpaths =
    python/exercises
    theory/exercises
    sql
addopts = -q --tb=short
